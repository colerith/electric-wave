name: Deploy website to server
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: electric-wave-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SSH_HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_PORT: ${{ secrets.DEPLOY_PORT }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Test
        run: |
          npm ci
          npm test
          bash -n scripts/deploy-server.sh
          bash scripts/test-deploy.sh
      - name: Configure SSH and detect server architecture
        id: target
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Set DEPLOY_HOST}" "${SSH_USER:?Set DEPLOY_USER}"
          : "${SSH_PRIVATE_KEY:?Set DEPLOY_SSH_KEY}" "${SSH_KNOWN_HOSTS:?Set DEPLOY_KNOWN_HOSTS}"
          port="${SSH_PORT:-22}"
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ && "$SSH_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ && "$port" =~ ^[0-9]+$ ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host electric-wave-deploy
            HostName $SSH_HOST
            User $SSH_USER
            Port $port
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF
          case "$(ssh electric-wave-deploy uname -m)" in
            x86_64) echo 'platform=linux/amd64' >> "$GITHUB_OUTPUT" ;;
            aarch64|arm64) echo 'platform=linux/arm64' >> "$GITHUB_OUTPUT" ;;
            *) echo 'Unsupported server architecture'; exit 1 ;;
          esac
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: Build server image
        env:
          TARGET_PLATFORM: ${{ steps.target.outputs.platform }}
        run: |
          docker buildx build --platform "$TARGET_PLATFORM" --load \
            --tag "electric-wave-release:$GITHUB_SHA" .
      - name: Transfer image and deploy
        run: |
          set -euo pipefail
          release="electric-wave-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker save "electric-wave-release:$GITHUB_SHA" | gzip > "$RUNNER_TEMP/$release.tar.gz"
          remote_dir=$(ssh electric-wave-deploy 'mktemp -d /tmp/electric-wave-deploy.XXXXXXXX')
          [[ "$remote_dir" =~ ^/tmp/electric-wave-deploy\.[a-zA-Z0-9]+$ ]]
          trap 'ssh electric-wave-deploy "rm -f -- $remote_dir/image.tar.gz $remote_dir/deploy.sh; rmdir -- $remote_dir" || true' EXIT
          scp "$RUNNER_TEMP/$release.tar.gz" "electric-wave-deploy:$remote_dir/image.tar.gz"
          scp scripts/deploy-server.sh "electric-wave-deploy:$remote_dir/deploy.sh"
          ssh electric-wave-deploy "bash $remote_dir/deploy.sh $GITHUB_SHA $remote_dir/image.tar.gz"
      - name: Remove local SSH credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config ~/.ssh/known_hosts
